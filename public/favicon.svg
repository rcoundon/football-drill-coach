<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Football">
  <title>Football</title>
  <!--
    The board's pentagon-and-seams football, redrawn for a 16px tab.
    Proportions differ deliberately from the in-app ball: a first attempt
    with a small pentagon and long even seams read as a wheel, so the
    pentagon is larger and the seams stop well short of the rim. The dark
    rim is what keeps a white ball visible against a light tab bar.
  -->
  <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#1f2933" stroke-width="2.2" />
  <polygon points="16.00,8.60 23.04,13.71 20.35,21.99 11.65,21.99 8.96,13.71" fill="#1f2933" />
  <g stroke="#1f2933" stroke-width="1.6" stroke-linecap="round">
    <line x1="16.00" y1="8.60" x2="16.00" y2="6.20" />
    <line x1="23.04" y1="13.71" x2="25.32" y2="12.97" />
    <line x1="20.35" y1="21.99" x2="21.76" y2="23.93" />
    <line x1="11.65" y1="21.99" x2="10.24" y2="23.93" />
    <line x1="8.96" y1="13.71" x2="6.68" y2="12.97" />
  </g>
</svg>
