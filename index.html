<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Satoshi for the interface, JetBrains Mono for every number the board
      shows. Both are asked for rather than depended on: the board falls back
      to the platform's own faces, which is what a coach at a pitch with no
      signal gets.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@400,500,700,800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <title>Tactics Board</title>
    <!-- For AI agents: how to write drills this app imports. See vite.config.ts. -->
    <link vite-ignore rel="alternate" type="text/markdown" href="/agents.md" title="Writing drills for this app" />
    <link vite-ignore rel="help" type="text/plain" href="/llms.txt" />
  </head>
  <body>
    <!--
      Outside #app so Vue's mount leaves it alone. Visually hidden but kept in
      the accessibility tree, which is what many browsing agents read.
    -->
    <p class="agent-hint" style="position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap">
      Writing drills for this board with an AI agent? Instructions are at /agents.md, and a summary at /llms.txt.
    </p>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
